name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Static analysis (go vet)
        run: |
          go vet ./...

      - name: Build binary
        run: |
          make build

      - name: Run unit & integration tests with race detector and coverage
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Smoke test CLI & virtual air E2E transfer
        run: |
          ./bin/wifichat help
          ./bin/wifichat drivers
          ./bin/wifichat --driver sim scan
          AIR_DIR=$(mktemp -d)
          ./bin/wifichat recv --driver sim --sim-dir "$AIR_DIR" -k "ci-key" --scan-interval 15ms --once > /tmp/wc_recv.log 2>&1 &
          RECV_PID=$!
          sleep 0.2
          ./bin/wifichat send "ci-ssid-smoke-ok" --driver sim --sim-dir "$AIR_DIR" -k "ci-key" --dwell 20ms
          wait $RECV_PID
          grep -q "ci-ssid-smoke-ok" /tmp/wc_recv.log

  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK and gomobile
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' | sort | tail -1)
          fi
          yes | "$SM" --licenses >/dev/null || true
          NDK_PKG=$("$SM" --list 2>/dev/null | awk '/^[[:space:]]*ndk;/{print $1}' | sort -V | tail -1)
          "$SM" --install "$NDK_PKG"
          echo "ANDROID_NDK_HOME=$SDK/${NDK_PKG//;/\/}" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Go mobile AAR
        env:
          WIFICHAT_GOMOBILE_TARGETS: android/amd64
        run: |
          gomobile init
          bash android/scripts/build_mobile.sh

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
